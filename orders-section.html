<section id="orders-section" class="content-section">
    <div class="content-header">
    </br> </br>
        <h1><i class="fas fa-shopping-cart"></i> ניהול הזמנות</h1>
        <p class="text-muted">צפייה וניהול הזמנות באתר</p>
    </div>
    
    <!-- פילטרים ומיון -->
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="form-container">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">סינון הזמנות</h5>
                    <div class="d-flex">
                        <div class="form-group mr-2 mb-0">
                            <select class="form-control" id="order-filter-status">
                                <option value="">כל הסטטוסים</option>
                                <option value="completed">הושלם</option>
                                <option value="pending">ממתין לתשלום</option>
                                <option value="cancelled">בוטל</option>
                            </select>
                        </div>
                        <div class="form-group mr-2 mb-0">
                            <select class="form-control" id="order-sort-order">
                                <option value="date_desc">תאריך: מהחדש לישן</option>
                                <option value="date_asc">תאריך: מהישן לחדש</option>
                                <option value="price_desc">מחיר: מהגבוה לנמוך</option>
                                <option value="price_asc">מחיר: מהנמוך לגבוה</option>
                            </select>
                        </div>
                        <div class="form-group mb-0">
                            <div class="input-group">
                                <input type="text" class="form-control" placeholder="חיפוש..." id="order-search">
                                <div class="input-group-append">
                                    <button class="btn btn-outline-secondary" type="button">
                                        <i class="fas fa-search"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- רשימת הזמנות -->
    <div class="data-table">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>מס' הזמנה</th>
                    <th>תאריך</th>
                    <th>לקוח</th>
                    <th>סה"כ</th>
                    <th>סטטוס</th>
                    <th>פעולות</th>
                </tr>
            </thead>
            <tbody id="orders-list">
                <!-- Orders will be loaded here -->
            </tbody>
        </table>
    </div>
    
    <!-- פאגינציה -->
    <nav aria-label="Orders pagination">
        <ul class="pagination" id="orders-pagination">
            <li class="page-item disabled">
                <a class="page-link" href="#" tabindex="-1">הקודם</a>
            </li>
            <li class="page-item active"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item">
                <a class="page-link" href="#">הבא</a>
            </li>
        </ul>
    </nav>
</section>
