<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>דף תשלום</title>
    <link href="payment.css" rel="stylesheet">

    <script>
      document.addEventListener('DOMContentLoaded', function() {
          // בדיקה וסנכרון של מזהי המשתמש בין כל מקומות האחסון
          const userInfo = localStorage.getItem('userInfo') ? JSON.parse(localStorage.getItem('userInfo')) : null;
          const userId = localStorage.getItem('usrId');
          const userName = localStorage.getItem('UserName');
          
          console.log('מזהי משתמש נוכחיים:', { userInfo, userId, userName });
          
          // שמירת מזהה המשתמש ב-sessionStorage לשימוש בעמוד התשלום
          if (userId) {
              sessionStorage.setItem('userId', userId);
              console.log('מזהה משתמש נשמר ב-sessionStorage:', userId);
          }
      
          // בדיקה אם יש עגלת קניות
          const checkCart = async () => {
              if (!userId) {
                  console.error('לא נמצא מזהה משתמש');
                  return;
              }
              
              try {
                  const response = await fetch(`/api/cart/${userId}`);
                  const data = await response.json();
                  
                  console.log('נתוני עגלה:', data);
                  
                  if (!data.cart || data.cart.length === 0) {
                      alert('העגלה שלך ריקה. אנא הוסף פריטים לפני ביצוע תשלום.');
                      window.location.href = '/';
                  }
              } catch (error) {
                  console.error('שגיאה בבדיקת העגלה:', error);
              }
          };
          
          // הפעלת הבדיקה
          checkCart();
      });
      </script>
</head>

<body>

<div class="footer">
<div class="payment-methods">
  <img src="ויזה.png" alt="ויזה">
  <img src="ישרכארט.png" alt="ישרכארט">
  <img src="ביט.png" alt="ביט">
<img src="כאל.png" alt="כאל">
</div>
</div>

<div class="container">
    <h2>פרטי תשלום</h2>
    <form method="post" action="/payment" onsubmit="return showPopup(event)">
        <label for="card_number">:מספר כרטיס אשראי</label>
        <input type="text" id="card_number" name="card_number" pattern="\d{4} \d{4} \d{4} \d{4}" title="יש להזין 16 ספרות" maxlength="19" placeholder="מספר כרטיס אשראי (לדוגמה: 5678 1234 5678 1234)" required oninput="formatCardNumber(this)">

        <label for="expiry_date">:תוקף</label>
        <input type="text" id="expiry_date" name="expiry_date" placeholder="MM/YYYY" required oninput="formatExpiryDate(this)" maxlength="7">

        <label for="cvv">:CVV</label>
        <input type="text" id="cvv" name="cvv" pattern="\d{3}" title="יש להזין 3 ספרות" maxlength="3" required>

        <button type="submit">
            שלם
        </button>
        <div id="loading" class="loading" style="display: none;">טוען...</div> <!-- הספינר -->
    </form>
</div>

<!-- Pop-up message -->
<div id="popup" class="popup" style="display: none;">
  <span class="close" onclick="closePopup()">&times;</span>
  <p>!התשלום בוצע בהצלחה</p>
  <p>:)טיול מהנה</p>
  <div id="order-number"> מספר הזמנה: <span id="order-number-value"></span></div>
</div>


<script src="payment.js"></script>


</body>

</html>
